name: Daily Dev Journal Continuous Update (30m Interval)

on:
  schedule:
    # Runs every 30 minutes (48 times a day, 1 commit per run)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions anytime

permissions:
  contents: write

jobs:
  update-journal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull Latest Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase origin main || true

      - name: Generate Entry
        run: |
          python src/generator.py

      - name: Commit and Push
        run: |
          git add -A
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
            git commit -m "docs(journal): sync entry [$TIMESTAMP]"
            git push origin main
          else
            echo "No changes detected."
          fi
