name: Procedural Dungeon Level Generator (30m Interval)

on:
  schedule:
    # Runs every 30 minutes on off-peak minutes (:13 and :43) to avoid GitHub runner queue bottlenecks
    - cron: '13,43 * * * *'
  workflow_dispatch: # Allows manual generation from GitHub Actions anytime

permissions:
  contents: write

jobs:
  generate-dungeon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull Latest Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase origin main || true

      - name: Generate Solvable Procedural Dungeon
        run: |
          python src/dungeon_generator.py

      - name: Commit and Push Level
        run: |
          git add -A
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
            git commit -m "feat(dungeon): procedural level generated [$TIMESTAMP]"
            git push origin main
          else
            echo "No changes detected."
          fi
