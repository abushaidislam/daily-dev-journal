name: Daily Dev Journal Continuous Update

on:
  schedule:
    # Runs every 2 hours throughout the day (12 automated runs per day)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      commit_count:
        description: 'Number of commits to generate right now'
        required: false
        default: '10'

permissions:
  contents: write

jobs:
  update-journal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Entries and Commit
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Use input commit count if manually triggered, otherwise 1 on scheduled run
          COUNT="${{ github.event.inputs.commit_count }}"
          if [ -z "$COUNT" ]; then
            COUNT=1
          fi

          echo "Generating $COUNT commit(s)..."

          for i in $(seq 1 $COUNT); do
            python src/generator.py
            git add -A
            if ! git diff --staged --quiet; then
              TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
              git commit -m "docs(journal): entry sync #$i [$TIMESTAMP]"
            fi
            sleep 1
          done

          git push
